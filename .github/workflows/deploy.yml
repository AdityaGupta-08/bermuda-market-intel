name: Refresh and Deploy

on:
  schedule:
    - cron: '15 */3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_all.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Refresh latest credit spreads
        run: python scripts/fetch_credit_latest.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Fetch government debt maturity data
        run: python scripts/fetch_debt_maturity.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Fetch PE reinsurer spread disclosures (SEC EDGAR)
        run: python scripts/fetch_reinsurer_spreads.py
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Fetch news & regulatory updates
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Refresh reinsurer news monitor
        run: python scripts/news_monitor.py
        continue-on-error: true

      # Fetch steps use continue-on-error so one dead source can't block the
      # refresh; this step makes what failed visible on the run instead.
      - name: Summarize pipeline status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ["## Pipeline status", "", "| Feed | Result |", "|---|---|"]
          try:
              results = json.loads(Path("data/manifest.json").read_text()).get("results", {})
          except Exception as e:
              results = {"manifest": f"error: unreadable ({e})"}
          for name, res in results.items():
              lines.append(f"| {name} | {res} |")
              if res != "ok":
                  print(f"::warning title={name}::{res}")
          try:
              health = json.loads(Path("data/source_health.json").read_text())
              stagnant = [s["source"] for s in health.get("sources", []) if s.get("status") == "stagnant"]
              lines += ["", f"Source health: {health.get('summary')}"]
              if stagnant:
                  lines.append("Stagnant: " + ", ".join(stagnant))
          except Exception:
              pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Copy data into build
        run: |
          mkdir -p public/data && cp data/*.json public/data/ 2>/dev/null || echo "No data yet"
          cp docs/reinsurer-news.html public/ 2>/dev/null || echo "No news dashboard yet"

      - run: npm run build

      - uses: actions/configure-pages@v4

      # One artifact name per attempt: on a re-run, deploy-pages otherwise finds
      # the earlier attempt's "github-pages" artifact too and refuses to deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
