# TEMPORARY: dumps SEC table layouts for the reinsurer parser. Removed before merge.
name: Debug SEC layouts (temporary)
on:
  push:
    branches: [claude/nice-bohr-z6dg1t]
    paths: ['.github/workflows/debug-sec.yml', 'scripts/debug_sec_layouts.py']
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/debug_sec_layouts.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
