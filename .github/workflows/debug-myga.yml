# TEMPORARY: checks what MYGA quote pages return to the fetcher. Removed before merge.
name: Debug MYGA sources (temporary)
on:
  push:
    branches: [claude/nice-bohr-z6dg1t]
    paths: ['.github/workflows/debug-myga.yml', 'scripts/debug_myga_sources.py']
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/debug_myga_sources.py
